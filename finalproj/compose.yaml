services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wiot-backend
    env_file:
      - backend/.env
    environment:
      APP_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: sqlite:///app/backend/database.db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/database.db:/app/backend/database.db
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wiot-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped
